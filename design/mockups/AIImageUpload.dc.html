<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
  :root{
    --bg-app:#161617; --bg-titlebar:#1c1c1e; --bg-activity:#1a1a1b; --bg-sidebar:#202021;
    --bg-editor:#141415; --bg-canvas:#232326;
    --border:#2e2e30; --border-strong:#46464a;
    --text-primary:#e2e2e3; --text-secondary:#9c9ca0; --text-muted:#6d6d70;
    --accent:#5b8def;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg-app);color:var(--text-primary);}
  .app{width:1440px;height:900px;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .titlebar{height:44px;flex-shrink:0;background:var(--bg-titlebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;font-size:12px;color:var(--text-secondary);}
  .dd{margin-left:auto;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--accent);border-radius:4px;font-size:11.5px;color:var(--text-primary);background:#1c2434;}
  .body-row{flex:1;display:flex;min-height:0;}
  .activity-bar{width:48px;flex-shrink:0;background:var(--bg-activity);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;}
  .abtn{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);margin-bottom:4px;}
  .abtn.push{margin-top:auto;}
  .avatar-active{width:30px;height:30px;border-radius:50%;background:#3a3a3d;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-primary);}
  .sidebar{width:200px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);}
  .editor{width:38%;flex-shrink:0;background:var(--bg-editor);}
  .canvas{flex:1;background:var(--bg-canvas);background-image:radial-gradient(#38383b 1px, transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;position:relative;}
  .dropzone{width:76%;height:64%;border:2px dashed var(--accent);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--text-secondary);background:rgba(91,141,239,0.05);}
  .dropzone svg{opacity:0.8;}
  .dropzone .title{font-size:15px;font-weight:600;color:var(--text-primary);}
  .dropzone .sub{font-size:12.5px;color:var(--text-muted);max-width:340px;text-align:center;line-height:1.5;}
  .browse-btn{margin-top:6px;height:30px;padding:0 16px;border-radius:4px;background:var(--accent);color:#0d1424;font-size:12px;font-weight:600;display:flex;align-items:center;}
  .formats{font-size:11px;color:var(--text-muted);}
</style>
</helmet>
<div class="app">
  <div class="titlebar">DiagramCode &nbsp;·&nbsp; workspace / diagrams / <b style="color:#e2e2e3">untitled.dsl</b>
    <div class="dd">✦ AI → Image</div>
  </div>
  <div class="body-row">
    <div class="activity-bar">
      <div class="abtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h6l2 2h8v12a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6"/></svg></div>
      <div class="abtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/></svg></div>
      <div class="abtn push"></div>
      <div class="avatar-active">КХ</div>
    </div>
    <div class="sidebar"></div>
    <div class="editor"></div>
    <div class="canvas">
      <div class="dropzone">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3M12 3v11m0 0l-4-4m4 4l4-4" stroke="#5b8def" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="title">Загрузите изображение диаграммы</div>
        <div class="sub">Перетащите файл сюда, или нажмите «Выбрать файл». Система распознает фигуры, текст и связи и предложит DSL‑код.</div>
        <div class="browse-btn">Выбрать файл…</div>
        <div class="formats">PNG · SVG · JPG, до 10 МБ</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
