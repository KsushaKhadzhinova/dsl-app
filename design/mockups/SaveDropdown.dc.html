<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
  :root{
    --bg-app:#161617; --bg-titlebar:#1c1c1e; --bg-activity:#1a1a1b; --bg-sidebar:#202021;
    --bg-editor:#141415; --bg-canvas:#232326;
    --border:#2e2e30; --border-strong:#46464a;
    --text-primary:#e2e2e3; --text-secondary:#9c9ca0; --text-muted:#6d6d70;
    --accent:#5b8def;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg-app);color:var(--text-primary);}
  .app{width:1000px;height:700px;display:flex;flex-direction:column;overflow:visible;position:relative;}
  .titlebar{height:44px;flex-shrink:0;background:var(--bg-titlebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;position:relative;z-index:2;}
  .brand{font-weight:700;font-size:13px;margin-right:auto;}
  .btn{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:4px;font-size:12px;font-weight:500;border:1px solid var(--border-strong);color:var(--text-secondary);}
  .btn-save{border-color:var(--accent);background:#1c2434;color:var(--text-primary);position:relative;}
  .btn-save::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #1f1f22;}
  .dropdown{position:absolute;top:52px;right:220px;width:280px;background:#1f1f22;border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,0.5);overflow:hidden;z-index:3;}
  .dd-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #2a2a2c;}
  .dd-item:last-child{border-bottom:none;}
  .dd-item .ic{width:28px;height:28px;border-radius:5px;background:#2a2a2d;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dd-item .label{font-size:12.5px;font-weight:600;color:var(--text-primary);}
  .dd-item .sub{font-size:11px;color:var(--text-muted);}
  .rest{flex:1;background:var(--bg-editor);opacity:0.5;}
</style>
</helmet>
<div class="app">
  <div class="titlebar">
    <div class="brand">DiagramCode</div>
    <div class="btn">Run</div>
    <div class="btn btn-save">💾 Save ▾</div>
    <div class="btn">Export</div>
  </div>
  <div class="rest"></div>
  <div class="dropdown">
    <div class="dd-item">
      <div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM8 12l3 3 5-6" stroke="#e2e2e3" stroke-width="1.5"/></svg></div>
      <div><div class="label">GitHub</div><div class="sub">API commit — сохранить в репозиторий</div></div>
    </div>
    <div class="dd-item">
      <div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3M12 3v13m0 0l-4-4m4 4l4-4" stroke="#e2e2e3" stroke-width="1.5"/></svg></div>
      <div><div class="label">Google Drive</div><div class="sub">API upload — загрузить в облако</div></div>
    </div>
    <div class="dd-item">
      <div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="12" rx="1" stroke="#e2e2e3" stroke-width="1.5"/><path d="M8 20h8M12 16v4" stroke="#e2e2e3" stroke-width="1.5"/></svg></div>
      <div><div class="label">На устройство</div><div class="sub">Скачать main.dsl</div></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
