<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
  :root{
    --bg:#161617; --panel:#1c1c1e; --border:#2e2e30; --border-strong:#46464a;
    --text-primary:#e2e2e3; --text-secondary:#9c9ca0; --text-muted:#6d6d70; --accent:#5b8def; --danger:#e2564c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-primary);}
  .app{width:900px;height:960px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    background-image:radial-gradient(#232326 1px, transparent 1px);background-size:26px 26px;}
  .card{width:400px;background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,0.45);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;margin-bottom:6px;justify-content:center;}
  .sub{text-align:center;color:var(--text-muted);font-size:12.5px;margin-bottom:26px;}
  label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
  .field{margin-bottom:14px;}
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}
  .input{height:36px;border:1px solid var(--border-strong);border-radius:4px;background:#141415;padding:0 12px;font-size:13px;color:var(--text-primary);display:flex;align-items:center;}
  .input.focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,141,239,0.18);}
  .input.err{border-color:var(--danger);}
  .hint-err{font-size:11px;color:var(--danger);margin-top:5px;}
  .check-row{display:flex;align-items:flex-start;gap:8px;margin:16px 0 18px;font-size:11.5px;color:var(--text-secondary);line-height:1.5;}
  .check-box{width:15px;height:15px;border-radius:3px;border:1px solid var(--border-strong);background:var(--accent);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .btn-primary{height:38px;border-radius:4px;background:var(--accent);color:#0d1424;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--text-muted);font-size:11px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .oauth{display:flex;gap:10px;}
  .oauth-btn{flex:1;height:36px;border:1px solid var(--border-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--text-secondary);}
  .foot{text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);}
  .foot a{color:var(--accent);}
</style>
</helmet>
<div class="app">
  <div class="card">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="#e2e2e3" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="#e2e2e3" stroke-width="1.6"/><path d="M11 7h6M17 7v6" stroke="#5b8def" stroke-width="1.6" stroke-linecap="round"/></svg>
      DiagramCode
    </div>
    <div class="sub">Создайте аккаунт, чтобы сохранять и версионировать диаграммы</div>
    <div class="field"><label>Имя</label><div class="input">Ксения Хаджинова</div></div>
    <div class="field"><label>Email</label><div class="input focus">you@example.com</div></div>
    <div class="row2">
      <div class="field"><label>Пароль</label><div class="input">••••••••••</div></div>
      <div class="field">
        <label>Повтор пароля</label>
        <div class="input err">••••••••</div>
        <div class="hint-err">Пароли не совпадают</div>
      </div>
    </div>
    <div class="check-row">
      <div class="check-box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="#0d1424" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      Согласен(на) с условиями использования и политикой обработки данных
    </div>
    <div class="btn-primary">Зарегистрироваться</div>
    <div class="divider">или</div>
    <div class="oauth">
      <div class="oauth-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM8 12l3 3 5-6" stroke="#9c9ca0" stroke-width="1.5"/></svg>GitHub</div>
      <div class="oauth-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3M12 3v13m0 0l-4-4m4 4l4-4" stroke="#9c9ca0" stroke-width="1.5"/></svg>Google</div>
    </div>
    <div class="foot">Уже есть аккаунт? <a>Войти</a></div>
  </div>
</div>
</x-dc>
</body>
</html>
