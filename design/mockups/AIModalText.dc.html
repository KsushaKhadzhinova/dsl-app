<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
  :root{
    --bg-app:#161617; --bg-titlebar:#1c1c1e; --bg-sidebar:#202021;
    --bg-editor:#141415; --bg-canvas:#232326;
    --border:#2e2e30; --border-strong:#46464a;
    --text-primary:#e2e2e3; --text-secondary:#9c9ca0; --text-muted:#6d6d70;
    --accent:#5b8def;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg-app);color:var(--text-primary);}
  .app{width:1440px;height:900px;position:relative;overflow:hidden;}
  .bg{position:absolute;inset:0;display:flex;flex-direction:column;filter:blur(2px) brightness(0.5);}
  .titlebar{height:44px;background:var(--bg-titlebar);border-bottom:1px solid var(--border);}
  .row{flex:1;display:flex;}
  .sidebar{width:220px;background:var(--bg-sidebar);border-right:1px solid var(--border);}
  .editor{width:45%;background:var(--bg-editor);}
  .canvas{flex:1;background:var(--bg-canvas);}
  .scrim{position:absolute;inset:0;background:rgba(8,8,9,0.55);}
  .modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:640px;background:#1c1c1e;border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 24px 64px rgba(0,0,0,0.55);overflow:hidden;}
  .m-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border);}
  .m-head svg{flex-shrink:0;}
  .m-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:0.3px;}
  .m-close{margin-left:auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
  .m-body{padding:20px 22px;}
  .mode-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .mtab{padding:6px 12px;border-radius:4px;font-size:11.5px;color:var(--text-secondary);border:1px solid var(--border-strong);}
  .mtab.active{background:var(--accent);color:#0d1424;border-color:var(--accent);font-weight:600;}
  label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
  textarea.fake{width:100%;min-height:110px;background:#141415;border:1px solid var(--accent);border-radius:4px;padding:12px;font-family:'Inter';font-size:13px;color:var(--text-primary);line-height:1.5;box-shadow:0 0 0 3px rgba(91,141,239,0.18);}
  .row-notation{display:flex;gap:10px;margin-top:14px;}
  .dd-small{flex:1;height:32px;border:1px solid var(--border-strong);border-radius:4px;background:#141415;display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--text-secondary);}
  .dd-small b{color:var(--text-primary);margin-left:4px;}
  .m-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}
  .btn2{height:32px;padding:0 16px;border-radius:4px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .btn-cancel{background:transparent;border:1px solid var(--border-strong);color:var(--text-secondary);}
  .btn-gen{background:var(--accent);color:#0d1424;border:1px solid var(--accent);}
  .btn-gen.pressed{box-shadow:0 0 0 3px rgba(91,141,239,0.35);transform:translateY(1px);}
</style>
</helmet>
<div class="app">
  <div class="bg">
    <div class="titlebar"></div>
    <div class="row">
      <div class="sidebar"></div>
      <div class="editor"></div>
      <div class="canvas"></div>
    </div>
  </div>
  <div class="scrim"></div>
  <div class="modal">
    <div class="m-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#5b8def"><path d="M12 2l1.8 5.6L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.4z"/></svg>
      <h2>AI Assistant</h2>
      <div class="m-close">✕</div>
    </div>
    <div class="m-body">
      <div class="mode-tabs">
        <div class="mtab active">Написать код</div>
        <div class="mtab">Исправить код</div>
        <div class="mtab">Исправить ошибку</div>
        <div class="mtab">Документация</div>
      </div>
      <label>Опишите диаграмму</label>
      <div class="fake" style="display:flex;align-items:flex-start;">Опиши процесс оформления заказа в BPMN</div>
      <div class="row-notation">
        <div class="dd-small">Нотация: <b>BPMN</b></div>
        <div class="dd-small">Тип: <b>Process</b></div>
      </div>
    </div>
    <div class="m-foot">
      <div class="btn2 btn-cancel">Отмена</div>
      <div class="btn2 btn-gen pressed">✦ Generate</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
